<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNN-IL | Heat Capacity Prediction</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --academic-blue: #001f3f; --border-color: #dee2e6; --bg-gray: #f8f9fa; }
        body, input, button, select, textarea { font-family: "Times New Roman", Times, serif !important; background-color: #ffffff; color: #212529; }
        .header-bar { border-bottom: 2px solid var(--academic-blue); padding: 20px 0; margin-bottom: 40px; background: #fff; }
        .system-title { color: var(--academic-blue); font-weight: 700; font-size: 1.75rem; margin: 0; cursor: pointer; text-decoration: none; }
        .academic-card { border: 1px solid var(--border-color); border-radius: 4px; padding: 30px; height: 100%; background: #fff; }
        .section-title { font-size: 1.1rem; font-weight: 600; color: var(--academic-blue); border-left: 4px solid var(--academic-blue); padding-left: 12px; margin-bottom: 25px; text-transform: uppercase; }
        .param-row { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .input-precise { width: 90px; text-align: center; border-radius: 2px; border: 1px solid var(--border-color); padding: 5px; color: var(--academic-blue); font-weight: bold; }
        .btn-predict { background-color: var(--academic-blue); border: none; color: white; padding: 12px 30px; font-weight: 600; border-radius: 2px; transition: 0.2s; letter-spacing: 1px; }
        .btn-predict:hover { background-color: #001122; color: #fff; }
        .result-panel { background-color: var(--bg-gray); border: 1px solid var(--border-color); text-align: center; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .result-label { color: #6c757d; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .result-value { font-size: 4rem; font-weight: 700; color: var(--academic-blue); margin: 10px 0; }
        .unit { font-size: 1.2rem; color: #495057; font-weight: 500; }
        .stats-footer { margin-top: 40px; font-size: 0.85rem; color: #adb5bd; border-top: 1px solid #eee; padding-top: 20px; }
        input[type=range]::-webkit-slider-thumb { background: var(--academic-blue); }
    </style>
</head>
<body>
<div class="header-bar">
    <div class="container d-flex align-items-center">
        <a href="/" class="system-title">Molar Heat Capacity Prediction System</a>
        <span class="ms-auto badge bg-secondary" style="font-family: Arial;">Version 2.3.0 | Skywalker</span>
    </div>
</div>
<div class="container">
    <div class="row g-5">
        <div class="col-md-6">
            <div class="academic-card">
                <div class="section-title">Experimental Configuration</div>
                <div class="mb-4">
                    <label class="fw-bold">Cation SMILES Notation</label>
                    <input type="text" id="cation" class="form-control" placeholder="e.g. CCn1cc[n+](C)c1">
                </div>
                <div class="mb-4">
                    <label class="fw-bold">Anion SMILES Notation</label>
                    <input type="text" id="anion" class="form-control" placeholder="e.g. F[B-](F)(F)F">
                </div>
                <div class="mb-4">
                    <label class="fw-bold">Temperature (T) / K</label>
                    <div class="param-row">
                        <input type="range" class="form-range flex-grow-1" id="t_range" min="273.15" max="473.15" step="0.01" value="298.15" oninput="syncInput('t_range', 't_num')">
                        <input type="number" id="t_num" class="input-precise" value="298.15" step="0.01" oninput="syncRange('t_num', 't_range')">
                    </div>
                </div>
                <div class="mb-5">
                    <label class="fw-bold">Pressure (P) / MPa</label>
                    <div class="param-row">
                        <input type="range" class="form-range flex-grow-1" id="p_range" min="0.1" max="100" step="0.1" value="0.1" oninput="syncInput('p_range', 'p_num')">
                        <input type="number" id="p_num" class="input-precise" value="0.1" step="0.1" oninput="syncRange('p_num', 'p_range')">
                    </div>
                </div>
                <button class="btn-predict w-100" onclick="runInference()">RUN GNN INFERENCE</button>
            </div>
        </div>
        <div class="col-md-6">
            <div class="academic-card result-panel">
                <div class="result-label">Predicted Molar Heat Capacity (Cp)</div>
                <div id="loading" class="spinner-border text-primary mx-auto my-4 d-none"></div>
                <div id="resultContainer">
                    <div class="result-value" id="display">--</div>
                    <div class="unit">J / (mol · K)</div>
                </div>
                <div class="stats-footer">
                    <div>Model: MultiProp-GNN | Feature: RDKit Fingerprints</div>
                    <div>Source: Physical Chemistry Data Center</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function syncInput(r, i) { document.getElementById(i).value = document.getElementById(r).value; }
    function syncRange(i, r) { document.getElementById(r).value = document.getElementById(i).value; }
    async function runInference() {
        const btn = document.querySelector('.btn-predict');
        const display = document.getElementById('display');
        const loading = document.getElementById('loading');
        btn.disabled = true; loading.classList.remove('d-none');
        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: "heat",
                    cation_smiles: document.getElementById('cation').value,
                    anion_smiles: document.getElementById('anion').value,
                    T: document.getElementById('t_num').value,
                    P: document.getElementById('p_num').value,
                    X: 1.0
                })
            });
            const data = await response.json();
            display.innerText = data.status === 'success' ? data.value : "Error";
        } catch (e) { alert("Backend Error"); } finally {
            btn.disabled = false; loading.classList.add('d-none');
        }
    }
</script>
</body>
</html>
